name: Bug report
description: Report a reproducible problem with hy2tun
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, control tokens, private keys, or production
        configuration files. For security issues, use the Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the minimal configuration and commands.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `hy2tund -version` or `hy2tun -version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, architecture, kernel, and deployment method.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets, public addresses, and client identifiers.
      render: text
