name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          check-latest: true
          cache: true

      - name: Unit, integration, and end-to-end tests
        run: go test ./... -count=1

      - name: Race detector
        run: go test -race ./... -count=1

      - name: Check JavaScript syntax
        run: |
          node --check internal/webui/clientui/static/app.js
          node --check internal/webui/serverui/static/app.js

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Staticcheck
        run: staticcheck ./...

      - name: Build
        run: make build

      - name: Validate OpenWrt packages
        run: ./scripts/openwrt/test-ipk.sh

      - name: Install LuCI controller test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 lua-cjson

      - name: Test LuCI controller
        run: ./scripts/openwrt/test-luci-controller.sh

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          check-latest: true
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: ./scripts/ci/govulncheck.sh
