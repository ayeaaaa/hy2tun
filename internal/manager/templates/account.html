{{define "content"}}
<div class="page-head">
  <div>
    <p class="eyebrow">管理器账户</p>
    <h1>修改管理员密码</h1>
    <p class="muted">单管理员账号；修改后所有已登录的管理器会话都会失效，需要重新登录。</p>
  </div>
  <div class="page-actions">
    <a class="btn btn-quiet" href="{{.BasePath}}">返回总览</a>
  </div>
</div>

<section class="panel form-panel" aria-labelledby="password-heading">
  <div class="panel-section panel-heading">
    <h2 id="password-heading">管理员密码</h2>
    <p class="muted">首次登录默认账号和密码都是 <span class="mono">admin</span>。请使用当前密码确认修改。</p>
  </div>
  <form class="server-form" action="{{.BasePath}}api/account/password" method="post"
        data-json-form data-method="PUT" data-success="{{.BasePath}}login"
        autocomplete="off">
    <label class="field">
      <span class="field-label">当前密码</span>
      <input class="input" type="password" name="current_password" autocomplete="current-password" required autofocus>
    </label>
    <label class="field">
      <span class="field-label">新密码</span>
      <input class="input" type="password" name="new_password" autocomplete="new-password" minlength="8" required>
      <span class="field-help">至少 8 个字符，最多 72 字节。</span>
    </label>
    <label class="field">
      <span class="field-label">确认新密码</span>
      <input class="input" type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">保存新密码</button>
      <a class="btn btn-quiet" href="{{.BasePath}}">取消</a>
    </div>
  </form>
</section>
{{end}}
