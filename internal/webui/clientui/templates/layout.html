{{define "layout"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{.Title}} · hy2tun 客户端</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="hy2tun 客户端首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">hy2tun</span>
        <span class="brand-sub">客户端</span>
      </a>
      <div class="nav">
        <a href="/servers">服务端</a>
      </div>
      <div class="topbar-actions">
        <span class="live" data-live="connecting" title="实时数据连接状态">
          <span class="live-dot" aria-hidden="true"></span>
          <span class="live-text">连接中</span>
        </span>
        <span class="user">{{.Username}}</span>
        <a class="btn btn-quiet btn-sm" href="https://github.com/ayeaaaa/hy2tun" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 上查看 hy2tun">GitHub</a>
        <button type="button" class="btn btn-quiet btn-sm" data-logout>退出</button>
      </div>
    </div>
  </header>
  <main class="page">
    {{template "content" .}}
  </main>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
{{end}}
