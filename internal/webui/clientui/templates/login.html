{{define "login"}}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>登录 · hy2tun 客户端</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>hy2tun</span>
        <span class="brand-sub">客户端</span>
      </div>
      <h1>登录客户端控制台</h1>
      <p class="login-intro muted">管理本机的反向端口映射、日志与连接状态。</p>
      {{if .Error}}<div class="alert alert-bad" role="alert">{{.Error}}</div>{{end}}
      <form class="login-form" method="post" action="/api/login" autocomplete="on">
        <label class="field">
          <span class="field-label">用户名</span>
          <input class="input" type="text" name="username" value="{{.Username}}" autocomplete="username" required autofocus>
        </label>
        <label class="field">
          <span class="field-label">密码</span>
          <input class="input" type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary btn-block" type="submit">登录</button>
      </form>
      <p class="login-foot muted">首次启动的客户端 Web 密码会在启动时输出一次。</p>
      <p class="login-foot muted"><a href="https://github.com/ayeaaaa/hy2tun" target="_blank" rel="noopener noreferrer">GitHub 项目</a></p>
    </section>
  </main>
</body>
</html>
{{end}}
