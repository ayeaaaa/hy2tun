# hy2tun basic client configuration.
#
# Copy this file to /etc/hy2tun/client.yaml and replace every placeholder.
# The file contains secrets and must be readable only by the account that
# runs hy2tun: chmod 600 /etc/hy2tun/client.yaml.
#
# This example covers a single server and the fields exposed by the LuCI
# page. For multiple servers or advanced options, use the built-in client
# console or edit the installed /etc/hy2tun/client.yaml over SSH.

server: "us.example.com:24443"
auth: "change-me"
tls:
  sni: "us.example.com"
  insecure: false
control:
  token: "0123456789abcdef"
client:
  name: "openwrt"
mappings:
  - id: ""
    type: tcp
    remote_port: 0
    local_addr: "127.0.0.1:22"
    enabled: true
web:
  listen: "0.0.0.0:7501"
  username: "admin"
  # LuCI refuses to start a single-server service while web.listen is set and
  # this hash is empty. Set a Web console password (at least 8 characters) in
  # the LuCI form, or leave web.listen empty to disable the console. The CLI
  # generates a password when this hash is empty.
  password_hash: ""
log:
  level: "info"
